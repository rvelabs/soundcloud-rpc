name: Verify
on:
    push:
        branches: [main]
        paths-ignore: ['docs/**', '**/*.md']
    pull_request:
        paths-ignore: ['docs/**', '**/*.md']
    workflow_dispatch:
permissions:
    contents: read
jobs:
    verify:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx tsc --noEmit
            - run: npm run lint
            - run: npm test
            - run: npm run test:worker
            - run: npm run test:import
            - run: npm run test:runtime
            - run: npm run test:assets
    package:
        if: github.event_name == 'workflow_dispatch'
        needs: verify
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build-win
            - run: node scripts/check-package.cjs build/win-unpacked
            - uses: actions/upload-artifact@v4
              with:
                  name: soundcloud-windows
                  path: |
                      build/*installer-win.exe
                      build/*.blockmap
                      build/latest.yml
                  if-no-files-found: error
    native:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: native
            - run: npm ci
            - run: npm run native:test
            - run: cargo fmt --manifest-path native/Cargo.toml -- --check
            - run:
                  cargo --config native/.cargo/config.toml clippy --locked --manifest-path native/Cargo.toml
                  --all-targets -- -D warnings
            - run: cargo --config native/.cargo/config.toml build --locked --manifest-path native/Cargo.toml
            - run: npm run native:smoke
              env:
                  SOUNDCLOUD_NATIVE_TEST_DEBUG: '1'
