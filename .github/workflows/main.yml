name: Verify
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    verify:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx tsc --noEmit
            - run: npm run lint
            - run: npm test
            - run: npm run test:worker
            - run: npm run test:import
            - run: npm run test:runtime
            - run: npm run test:assets
    package:
        if: github.event_name == 'workflow_dispatch'
        needs: verify
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build-win
            - run: node scripts/check-package.cjs build/win-unpacked
            - uses: actions/upload-artifact@v4
              with:
                  name: soundcloud-windows
                  path: |
                      build/*installer-win.exe
                      build/*.blockmap
                      build/latest.yml
                  if-no-files-found: error
    compatibility:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run compile
            - run: npm test
            - run: npm run test:worker
            - if: runner.os == 'macOS'
              timeout-minutes: 6
              run:
                  node scripts/check-runtime.cjs check-client-close-race.cjs check-minimized-start.cjs
                  check-source-pagination.cjs
            - if: runner.os == 'Linux'
              timeout-minutes: 6
              run: |
                  sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
                  xvfb-run -a node scripts/check-runtime.cjs check-client-close-race.cjs check-minimized-start.cjs check-source-pagination.cjs
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: runtime-${{ runner.os }}
                  path: |
                      build-runtime-check/**/results.json
                      build-runtime-check/**/stdout.log
                      build-runtime-check/**/stderr.log
                  if-no-files-found: ignore
