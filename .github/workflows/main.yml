name: Verify
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    verify:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx tsc --noEmit
            - run: npm run lint
            - run: npm test
            - run: npm run test:worker
            - run: npm run test:import
    package:
        if: github.event_name == 'workflow_dispatch'
        needs: verify
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build-win
            - uses: actions/upload-artifact@v4
              with:
                  name: soundcloud-windows
                  path: |
                      build/*installer-win.exe
                      build/*.blockmap
                      build/latest.yml
                  if-no-files-found: error
