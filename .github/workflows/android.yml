name: Android preview

on:
    workflow_dispatch:
    push:
        paths: ['mobile/**', '.github/workflows/android.yml']

permissions:
    contents: read

jobs:
    playback:
        runs-on: ubuntu-24.04
        timeout-minutes: 35
        defaults:
            run:
                working-directory: mobile
        env:
            NDK_VERSION: '27.2.12479018'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: mobile/package-lock.json
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21
                  cache: gradle
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-linux-android
            - run: |
                  (set +o pipefail; yes | sdkmanager --licenses)
                  sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION" "emulator" "system-images;android-36;google_apis;x86_64"
                  echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
            - run: npm ci
            - run: npm run android:build -- --target x86_64
            - name: Test queue with the display off
              run: |
                  sudo chmod a+rw /dev/kvm
                  echo no | avdmanager create avd --name soundcloud-ci --package 'system-images;android-36;google_apis;x86_64' --device pixel_7
                  "$ANDROID_HOME/emulator/emulator" -avd soundcloud-ci -no-window -no-audio -no-snapshot -gpu swiftshader > "$RUNNER_TEMP/soundcloud-emulator.log" 2>&1 &
                  emulator_pid=$!
                  trap 'adb emu kill >/dev/null 2>&1 || kill "$emulator_pid" 2>/dev/null || true' EXIT
                  timeout 180 adb wait-for-device
                  timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
                  adb shell wm dismiss-keyguard
                  bash gen/android/gradlew -p gen/android :app:connectedX86_64DebugAndroidTest -x :app:rustBuildX86_64Debug
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: android-preview
                  path: |
                      mobile/gen/android/app/build/outputs/apk/x86_64/debug/*.apk
                      mobile/gen/android/app/build/outputs/androidTest-results/
                      ${{ runner.temp }}/soundcloud-emulator.log
