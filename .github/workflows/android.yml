name: Android preview

on:
    workflow_dispatch:
    push:
        paths: ['mobile/**', '.github/workflows/android.yml']

permissions:
    contents: read

jobs:
    preview:
        runs-on: ubuntu-24.04
        timeout-minutes: 35
        strategy:
            fail-fast: false
            matrix:
                target: [x86_64, aarch64]
        defaults:
            run:
                working-directory: mobile
        env:
            NDK_VERSION: '27.2.12479018'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: mobile/package-lock.json
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21
                  cache: gradle
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}-linux-android
            - uses: android-actions/setup-android@v3
              with:
                  packages: ''
            - run: |
                  sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
                  echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
            - if: matrix.target == 'x86_64'
              run: sdkmanager --install "emulator" "system-images;android-36;google_apis;x86_64"
            - run: npm ci
            - run: chmod +x gen/android/gradlew
            - run: npm run android:build -- --target ${{ matrix.target }} --split-per-abi
            - name: Test queue with the display off
              if: matrix.target == 'x86_64'
              run: |
                  sudo chmod a+rw /dev/kvm
                  export ANDROID_USER_HOME="$RUNNER_TEMP/soundcloud-android"
                  export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
                  mkdir -p "$ANDROID_AVD_HOME"
                  echo no | avdmanager create avd --name soundcloud-ci --path "$ANDROID_AVD_HOME/soundcloud-ci.avd" --package 'system-images;android-36;google_apis;x86_64' --device pixel_7
                  "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx soundcloud-ci
                  "$ANDROID_HOME/emulator/emulator" -avd soundcloud-ci -no-window -no-audio -no-snapshot -gpu swiftshader > "$RUNNER_TEMP/soundcloud-emulator.log" 2>&1 &
                  emulator_pid=$!
                  trap 'timeout 8 adb logcat -d > "$RUNNER_TEMP/soundcloud-logcat.log" 2>&1 || true; adb emu kill >/dev/null 2>&1 || kill "$emulator_pid" 2>/dev/null || true' EXIT
                  timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do kill -0 "$1" || exit 1; sleep 2; done' -- "$emulator_pid"
                  adb shell wm dismiss-keyguard
                  bash gen/android/gradlew -p gen/android :app:connectedX86_64DebugAndroidTest -x :app:rustBuildX86_64Debug
            - name: Verify the phone APK signature
              if: matrix.target == 'aarch64'
              run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify gen/android/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk'
            - uses: actions/upload-artifact@v4
              if: matrix.target == 'aarch64'
              with:
                  name: soundcloud-android-arm64
                  path: mobile/gen/android/app/build/outputs/apk/arm64/debug/*.apk
                  if-no-files-found: error
            - uses: actions/upload-artifact@v4
              if: always() && matrix.target == 'x86_64'
              with:
                  name: android-preview
                  path: |
                      mobile/gen/android/app/build/outputs/apk/x86_64/debug/*.apk
                      mobile/gen/android/app/build/outputs/androidTest-results/
                      ${{ runner.temp }}/soundcloud-emulator.log
                      ${{ runner.temp }}/soundcloud-logcat.log
