[package]
name = "soundcloud-mobile"
version = "0.2.15"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[lib]
name = "soundcloud_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.6", features = [] }
base64 = "0.22"
futures-util = "0.3"
jni = "0.21"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "system-proxy", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util", "macros", "sync"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
regex = "1"
time = { version = "0.3", features = ["formatting"] }
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
validation-rs = { path = "../rust/validation-rs" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
