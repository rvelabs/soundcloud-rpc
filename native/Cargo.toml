[package]
name = "soundcloud-native"
version = "0.2.12"
edition = "2024"
rust-version = "1.88"
description = "SoundCloud desktop host for Windows WebView2"
license = "MIT"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "devtools", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ring = "0.17"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "system-proxy", "multipart"] }
url = "2"
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Memory", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
md-5 = "0.10"
sha2 = "0.10"
semver = "1"
tauri-plugin-updater = "2"
rquickjs = "0.11"
notify = "8"
uuid = { version = "1", features = ["v4"] }
regex = "1"
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
minisign-verify = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
